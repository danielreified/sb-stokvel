name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/stokvel-app/**'
      - 'packages/**'
      - 'bun.lock'

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint:ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test — PWA unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx turbo run test --filter=@seyva/stokvel-app

  build:
    name: Build & bundle size check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build PWA
        run: bunx turbo run build --filter=@seyva/stokvel-app
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: apps/stokvel-app/dist
          retention-days: 1

  deploy:
    name: Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.SITE_BUCKET }}/ \
            --delete \
            --only-show-errors

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/index.html" "/sw.js" "/manifest.webmanifest" \
            --output text --query 'Invalidation.{Id:Id,Status:Status}'
