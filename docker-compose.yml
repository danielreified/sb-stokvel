services:
  postgres:
    image: postgres:17-alpine
    container_name: seyva-postgres
    environment:
      POSTGRES_USER: seyva
      POSTGRES_PASSWORD: seyva
      POSTGRES_DB: seyva
    ports:
      - "5432:5432"
    volumes:
      - seyva_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seyva -d seyva"]
      interval: 2s
      timeout: 2s
      retries: 20

  postgres_test:
    image: postgres:17-alpine
    container_name: seyva-postgres-test
    environment:
      POSTGRES_USER: seyva
      POSTGRES_PASSWORD: seyva
      POSTGRES_DB: seyva_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seyva -d seyva_test"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  seyva_postgres_data:
